name = mouseReader
summary = "Mouse Reader"
description = """Read from here: hold NVDA+control and click in any text (or press NVDA+shift+R) and NVDA reads continuously from that spot, starting at the beginning of the paragraph, line or word, with commands to skip back and forward a paragraph. If nothing under the pointer has text, the window is OCRed and reading starts from the nearest recognised line. Settings under NVDA menu > Preferences > Settings > Mouse Reader."""
author = "Carrie on Accessibility"
url = https://apps.carrieonaccessibility.com
version = 0.3.6
docFileName = readme.html
