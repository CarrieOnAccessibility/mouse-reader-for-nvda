name = mouseReader
summary = "Mouse Reader"
description = """Hold NVDA+control and click (or press NVDA+control+enter) and the window under the mouse is recognised with Windows OCR; the paragraph under the pointer is read, and from then on hovering over that window reads its paragraphs. Scrolling the wheel recognises the window again. Works with full-screen Magnifier and with apps that cannot say what is under the mouse, such as Slack. Settings under NVDA menu > Preferences > Settings > Mouse Reader."""
author = "Carrie on Accessibility"
url = https://apps.carrieonaccessibility.com
version = 0.5.7
docFileName = readme.html
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
