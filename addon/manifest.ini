name = mouseReader
summary = "Mouse Reader"
description = """Hold NVDA+control and click (or press NVDA+control+enter) and the paragraph under the mouse is read; from then on hovering over that window reads its paragraphs. On a web page or a PDF in Chrome or Edge the page's own text is read, exact whatever the font; everywhere else the window is recognised with Windows OCR, with bullet dots found in the picture. Scrolling the wheel recognises an OCR window again. Works with full-screen Magnifier and with apps that cannot say what is under the mouse, such as Slack. Settings under NVDA menu > Preferences > Settings > Mouse Reader."""
author = "Carrie on Accessibility"
url = https://apps.carrieonaccessibility.com
version = 0.6.0
docFileName = readme.html
minimumNVDAVersion = 2026.1.0
lastTestedNVDAVersion = 2026.2.0
updateChannel = None
